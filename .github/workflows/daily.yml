name: daily-fit

# Once a day at 08:08 Beijing time (00:08 UTC).
# The PRUNplanner API author asked for gentle usage: one bulk request per day
# (/data/cxpc/daily/?days=3) instead of 370 per-ticker requests.
on:
  schedule:
    - cron: "8 0 * * *"
  workflow_dispatch:

permissions:
  contents: write      # needed to commit the monthly history file
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.event_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: audit request policy before any network call
        run: node tools/audit-request-policy.mjs
      - name: pull daily slice (one bulk request)
        run: node tools/pull-cxpc.mjs
      - name: commit history if it changed
        run: |
          git config user.name "prun-price-fit-bot"
          git config user.email "mlml22@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "no history change"
          else
            git commit -m "history: $(date -u +%F)"
            git push
          fi
      - name: build dataset
        run: node tools/build-dataset.mjs
      - name: fit + emit site payload
        run: node tools/analyze.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
