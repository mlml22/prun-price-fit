name: daily-fit

# 08:08 and 20:08 Beijing time (= 00:08 / 12:08 UTC).
# Manual runs never share a concurrency group with scheduled runs, so a manual
# refresh can never cancel or queue-block an automatic one; deployments serialise.
on:
  schedule:
    - cron: "8 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.event_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pull upstream history (read-only)
        run: node tools/pull-cxpc.mjs
      - name: build dataset
        run: node tools/build-dataset.mjs
      - name: fit + emit site payload
        run: node tools/analyze.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
