<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行情与成本锚 - PrUn 价格拟合看板</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e6e9ef; --dim:#98a2b3; --up:#26a69a; --down:#ef5350; --acc:#60a5fa; --grid:#1e232c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:16px 18px 10px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:19px; }
  h1 a { color:var(--dim); text-decoration:none; font-size:13px; font-weight:400; }
  .sub { color:var(--dim); font-size:12.5px; }
  main { padding:14px 18px 60px; max-width:1200px; margin:0 auto; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0 6px; }
  button.tab, button.rng { background:var(--card); border:1px solid var(--line); color:var(--fg); padding:5px 11px; border-radius:7px; cursor:pointer; font-size:13px; }
  button.tab:hover, button.rng:hover { border-color:#3a4252; }
  button.tab.on { background:#1f4fd8; border-color:#1f4fd8; color:#fff; }
  button.rng.on { background:#232936; border-color:#3a4252; }
  .wrap { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px; position:relative; }
  canvas { display:block; width:100%; height:440px; cursor:crosshair; }
  .tip { position:absolute; pointer-events:none; background:#0b0e13ee; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:12px; line-height:1.5; white-space:nowrap; display:none; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .card .k { color:var(--dim); font-size:12px; }
  .card .v { font-size:17px; font-weight:600; margin-top:2px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th,td { padding:6px 9px; text-align:right; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  thead th { background:#1d2129; color:var(--dim); font-size:12.5px; }
  tbody tr:last-child td { border-bottom:none; }
  .pos { color:var(--up); } .neg { color:var(--down); } .dim { color:var(--dim); }
  .stack { display:flex; height:12px; border-radius:6px; overflow:hidden; margin:8px 0 2px; border:1px solid var(--line); }
  .stack i { display:block; height:100%; }
  .note { color:var(--dim); font-size:12.5px; margin-top:10px; }
  h2 { font-size:15px; margin:22px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  code { background:#20242e; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1 id="title">加载中… <a href="index.html">← 返回看板</a></h1>
  <div class="sub" id="subtitle"></div>
</header>
<main>
  <div class="bar" id="tabs"></div>
  <div class="bar" id="ranges">
    <button class="rng" data-n="30">1M</button>
    <button class="rng" data-n="90">3M</button>
    <button class="rng" data-n="180">6M</button>
    <button class="rng" data-n="365">1Y</button>
    <button class="rng on" data-n="0">全部</button>
    <span class="dim" id="hint">滚轮缩放 · 拖拽平移 · 双击复位</span>
  </div>
  <div class="wrap"><canvas id="cv"></canvas><div class="tip" id="tip"></div></div>
  <div class="note" id="fcNote"></div>

  <h2>采掘成本（原料专有）</h2>
  <div id="extractBox"></div>

  <h2>月度供给（社区产能统计）</h2>
  <div id="supplyBox"></div>

  <h2>跨所价差与运费</h2>
  <div id="freight"></div>
  <div class="note" id="fnote"></div>

  <div class="cards" id="cards"></div>

  <h2>成本锚拆解（按同交易所当日价）</h2>
  <div id="breakdown"></div>
  <div class="note" id="bnote"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const fmt = (x, d = 2) => (x == null || Number.isNaN(x)) ? '—' : Number(x).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const int = (x) => (x == null) ? '—' : Number(x).toLocaleString('en-US');
const signCls = (x) => (x == null ? '' : (x > 0 ? 'pos' : (x < 0 ? 'neg' : '')));
const params = new URLSearchParams(location.search);
const T = (params.get('t') || 'RAT').toUpperCase();
let ZH = {};   // ticker -> Chinese name

let DATA = null, BOARD = null, FORECAST = null, FREIGHT = null, SUPPLY = null, EXTRACTION = null, FC = null, cxList = [], cx = params.get('cx'), view = null, hover = null;
const FUTURE_FRAC = 0.18;   // share of the plot width reserved for the model's forward path

const cv = $('#cv'), ctx = cv.getContext('2d');
function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.floor(r.width * dpr); cv.height = Math.floor(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener('resize', resize);

function rows() { return (DATA && DATA.series[cx]) || []; }
function setRange(n) {
  const r = rows(); if (!r.length) return;
  view = n > 0 ? { i0: Math.max(0, r.length - n), i1: r.length - 1 } : { i0: 0, i1: r.length - 1 };
  draw();
}
function sma(arr, n) { const out = []; let s = 0; for (let i = 0; i < arr.length; i++) { s += arr[i][4]; if (i >= n) s -= arr[i - n][4]; out.push(i >= n - 1 ? s / n : null); } return out; }

function draw() {
  const r = rows(), w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);
  if (!r.length) { ctx.fillStyle = '#98a2b3'; ctx.fillText('无数据', 12, 24); return; }
  const i0 = view ? view.i0 : 0, i1 = view ? view.i1 : r.length - 1;
  const slice = r.slice(i0, i1 + 1);
  const ma = sma(r, 10).slice(i0, i1 + 1);
  const fc = FC || null;
  const lastC0 = r[r.length - 1][4];
  const padL = 8, padR = 58, padT = 10, padB = 52;
  const volH = 56, chartH = h - padT - padB - volH - 6;
  let hi = -Infinity, lo = Infinity, maxV = 0;
  for (const k of slice) { hi = Math.max(hi, k[2]); lo = Math.min(lo, k[3]); maxV = Math.max(maxV, k[5]); }
  if (fc) {
    const e30 = Math.exp((fc.expected30Pct || 0) / 100), e90 = Math.exp((fc.expected90Pct || 0) / 100);
    const b90 = Math.exp((fc.band90Pct || 0) / 100);
    hi = Math.max(hi, lastC0 * e90 * b90); lo = Math.min(lo, lastC0 * e90 / b90);
  }
  const span = (hi - lo) || 1; hi += span * 0.06; lo -= span * 0.06;
  const plotW = (w - padL - padR) * (1 - FUTURE_FRAC);
  const X = (i) => padL + plotW * (i / Math.max(1, slice.length - 1));
  const XF = (days) => padL + plotW + plotW * FUTURE_FRAC * (days / 90);
  const Y = (p) => padT + chartH - chartH * (p - lo) / (hi - lo);
  const VY = (v) => padT + chartH + 6 + volH - volH * (v / (maxV || 1));

  // grid + price axis
  ctx.strokeStyle = '#1e232c'; ctx.fillStyle = '#98a2b3'; ctx.font = '11px ui-monospace,Menlo,monospace'; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const p = lo + (hi - lo) * g / 4, y = Y(p);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(fmt(p, p < 10 ? 2 : 0), w - padR + 5, y + 4);
  }
  // volume bars
  const bw = Math.max(1, Math.min(13, (w - padL - padR) / Math.max(1, slice.length) * 0.72));
  ctx.fillStyle = '#5b6473'; ctx.fillText('成交额', padL + 2, padT + chartH + 18);
  slice.forEach((k, i) => {
    ctx.fillStyle = k[4] >= k[1] ? '#26a69a55' : '#ef535055';
    ctx.fillRect(X(i) - bw / 2, VY(k[5]), bw, padT + chartH + 6 + volH - VY(k[5]));
  });
  // candles
  slice.forEach((k, i) => {
    const up = k[4] >= k[1];
    ctx.strokeStyle = ctx.fillStyle = up ? '#26a69a' : '#ef5350';
    ctx.beginPath(); ctx.moveTo(X(i), Y(k[2])); ctx.lineTo(X(i), Y(k[3])); ctx.stroke();
    const yO = Y(k[1]), yC = Y(k[4]);
    const top = Math.min(yO, yC), hgt = Math.max(1, Math.abs(yC - yO));
    ctx.fillRect(X(i) - bw / 2, top, Math.max(1, bw), hgt);
  });
  // MA10
  ctx.strokeStyle = '#60a5fa'; ctx.beginPath(); let started = false;
  ma.forEach((v, i) => { if (v == null) return; if (!started) { ctx.moveTo(X(i), Y(v)); started = true; } else ctx.lineTo(X(i), Y(v)); });
  ctx.stroke();
  // x labels
  ctx.fillStyle = '#98a2b3';
  const step = Math.max(1, Math.round(slice.length / (slice.length <= 40 ? Math.min(slice.length, 8) : 7)));
  for (let i = 0; i < slice.length; i += step) {
    const d = new Date(slice[i][0]).toISOString().slice(0, 10);
    ctx.fillText(d, Math.min(X(i) - 18, w - padR - 60), h - 8);
  }
  // model forecast path (dashed) + one-sigma band
  if (fc) {
    const e30 = Math.exp((fc.expected30Pct || 0) / 100), e90 = Math.exp((fc.expected90Pct || 0) / 100);
    const b30 = Math.exp((fc.band30Pct || 0) / 100), b90 = Math.exp((fc.band90Pct || 0) / 100);
    const x0 = X(slice.length - 1), y0 = Y(lastC0);
    const x30 = XF(30), y30 = Y(lastC0 * e30);
    const x90 = XF(90), y90 = Y(lastC0 * e90);
    ctx.fillStyle = 'rgba(245,158,11,0.13)';
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x30, Y(lastC0 * e30 * b30)); ctx.lineTo(x90, Y(lastC0 * e90 * b90));
    ctx.lineTo(x90, Y(lastC0 * e90 / b90)); ctx.lineTo(x30, Y(lastC0 * e30 / b30)); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x30, y30); ctx.lineTo(x90, y90); ctx.stroke(); ctx.restore();
    ctx.fillStyle = '#f59e0b';
    ctx.fillText('模型 30天 ' + ((fc.expected30Pct || 0) > 0 ? '+' : '') + (fc.expected30Pct || 0).toFixed(1) + '%', Math.min(x30 + 4, w - padR - 92), y30 - 4);
    ctx.fillText('90天 ' + ((fc.expected90Pct || 0) > 0 ? '+' : '') + (fc.expected90Pct || 0).toFixed(1) + '%', Math.min(x90 + 4, w - padR - 72), y90 - 4);
  }
  // last close reference
  const lastC = slice[slice.length - 1][4];
  ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = '#5b6473';
  ctx.beginPath(); ctx.moveTo(padL, Y(lastC)); ctx.lineTo(w - padR, Y(lastC)); ctx.stroke(); ctx.restore();
  ctx.fillStyle = '#c9d1d9'; ctx.fillText(fmt(lastC, lastC < 10 ? 2 : 0), w - padR + 5, Y(lastC) - 3);
  // crosshair + tooltip
  if (hover != null && hover >= i0 && hover <= i1) {
    const i = hover - i0, k = slice[i];
    ctx.strokeStyle = '#5b6473'; ctx.beginPath(); ctx.moveTo(X(i), padT); ctx.lineTo(X(i), padT + chartH + 6 + volH); ctx.stroke();
    ctx.strokeStyle = '#39414f'; ctx.beginPath(); ctx.moveTo(padL, Y(k[4])); ctx.lineTo(w - padR, Y(k[4])); ctx.stroke();
    ctx.fillStyle = '#c9d1d9'; ctx.fillText(fmt(k[4], k[4] < 10 ? 2 : 0), w - padR + 5, Y(k[4]) - 3);
    const tip = $('#tip');
    const chg = i > 0 ? (k[4] / slice[i - 1][4] - 1) * 100 : 0;
    tip.innerHTML = `${new Date(k[0]).toISOString().slice(0, 10)}<br>开 ${fmt(k[1])} 高 ${fmt(k[2])}<br>低 ${fmt(k[3])} 收 <b>${fmt(k[4])}</b><br>涨跌 <span class="${chg >= 0 ? 'pos' : 'neg'}">${chg.toFixed(2)}%</span><br>成交额 ${int(k[5])} · 量 ${int(k[6])}`;
    tip.style.display = 'block';
    tip.style.left = Math.min(X(i) + 12, w - 150) + 'px';
    tip.style.top = Math.max(4, Y(k[2]) - 10) + 'px';
  } else $('#tip').style.display = 'none';
}

cv.addEventListener('mousemove', (e) => {
  const r = cv.getBoundingClientRect(), r2 = rows();
  if (!r2.length || !view) return;
  const padL = 8, padR = 58, frac = (e.clientX - r.left - padL) / (cv.clientWidth - padL - padR);
  const n = view.i1 - view.i0 + 1;
  if (drag) { const d = Math.round(drag.x - e.clientX); const shift = Math.round(d / (cv.clientWidth - padL - padR) * n); view.i0 = clamp(drag.i0 + shift, 0, r2.length - n); view.i1 = view.i0 + n - 1; }
  hover = clamp(Math.round(view.i0 + frac * (n - 1)), 0, r2.length - 1);
  draw();
});
let drag = null;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
cv.addEventListener('mousedown', (e) => { drag = { x: e.clientX, i0: view.i0, i1: view.i1 }; });
window.addEventListener('mouseup', () => { drag = null; });
cv.addEventListener('mouseleave', () => { hover = null; draw(); });
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = rows(); if (!r.length) return;
  const n = view.i1 - view.i0 + 1;
  const factor = e.deltaY > 0 ? 1.18 : 1 / 1.18;
  const nn = clamp(Math.round(n * factor), 10, r.length);
  const anchor = clamp(view.i0 + Math.round((e.clientX / cv.clientWidth) * n), 0, r.length - 1);
  view.i0 = clamp(anchor - Math.round((anchor - view.i0) / n * nn), 0, r.length - nn);
  view.i1 = view.i0 + nn - 1;
  draw();
}, { passive: false });
cv.addEventListener('dblclick', () => setRange(0));
document.querySelectorAll('.rng').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.rng').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); setRange(Number(b.dataset.n));
}));

function breakdownHtml(row) {
  const cb = row && row.costBreakdown;
  if (!cb) return '<div class="note">该商品在上游没有可解析的配方（多半是采集类产物，如原矿/水），所以没有成本锚。</div>';
  const p = row.price;
  const matPct = cb.matCost / p * 100, labPct = (cb.labourCost || 0) / p * 100;
  const rowTd = (m) => `<tr><td>${m.ticker}</td><td>${fmt(m.per, 3)}</td><td>${fmt(m.price)}</td><td>${fmt(m.per * m.price)}</td><td class="dim">${(m.per * m.price / p * 100).toFixed(1)}%</td></tr>`;
  const labourRows = (cb.labourDetail || []).map(d => `<tr><td>${d.tier} × ${d.workers} 人</td><td class="dim">每 100 人/天 ${fmt(d.per100PerDay)}</td><td>${fmt(d.costPerDay)}</td><td>—</td><td class="dim">—</td></tr>`).join('');
  return `
    <div class="stack">
      <i style="width:${Math.max(0, matPct)}%; background:#60a5fa"></i>
      <i style="width:${Math.max(0, labPct)}%; background:#f59e0b"></i>
      <i style="width:${Math.max(0, 100 - matPct - labPct)}%; background:#26a69a"></i>
    </div>
    <div class="sub" style="margin-bottom:10px">
      原料 <b>${matPct.toFixed(1)}%</b> · 人工 <b>${labPct.toFixed(1)}%</b> · 剩余（折旧/税/利润）<b>${(100 - matPct - labPct).toFixed(1)}%</b>
      · 配方 <code>${cb.building}</code> 单批 ${fmt(cb.timeMs / 3600000, 2)} 小时产 ${fmt(cb.outAmount, 0)}
    </div>
    <table><thead><tr><th>投入</th><th>每单位用量</th><th>单价</th><th>成本</th><th>占售价</th></tr></thead>
    <tbody>${cb.matItems.map(rowTd).join('')}${labourRows}</tbody>
    <tfoot><tr><td><b>合计</b></td><td></td><td></td><td><b>${fmt(cb.totalCost)}</b></td><td>${(cb.totalCost / p * 100).toFixed(1)}%</td></tr></tfoot></table>`;
}

(async () => {
  // use the payload version as a cache buster: GitHub's CDN caches for 10 minutes otherwise,
  // which makes a fresh update look stale (found the hard way).
  const meta = await (await fetch('data/meta.json?ts=' + Date.now())).json();
  const ver = meta && meta.generatedAt ? encodeURIComponent(meta.generatedAt) : String(Date.now());
  const [hres, bres] = await Promise.all([fetch(`data/hist/${T}.json.gz?v=${ver}`), fetch('data/board.json?v=' + ver)]);
  const json = JSON.parse(await new Response(hres.body.pipeThrough(new DecompressionStream('gzip'))).text());
  BOARD = await bres.json();
  ZH = await fetch('materials-zh.json').then(r => r.json()).then(j => j.byTicker || {}).catch(() => ({}));
  FREIGHT = await fetch('data/freight.json?v=' + ver).then(r => r.json()).catch(() => null);
  SUPPLY = await fetch('data/supply.json?v=' + ver).then(r => r.json()).catch(() => null);
  EXTRACTION = await fetch('data/extraction.json?v=' + ver).then(r => r.json()).catch(() => null);
  const fcRes = await fetch('data/forecast.json?v=' + ver).then(r => r.json()).catch(() => null);
  FORECAST = fcRes;
  FC = (fcRes && fcRes.bySeries && fcRes.bySeries[T + '|' + cx]) || null;
  DATA = json;
  cxList = Object.keys(DATA.series).sort();
  if (!cx || !DATA.series[cx]) cx = cxList[0];
  const list = BOARD.rows.filter(r => r.ticker === T);
  const any = list[0] || {};
  $('#title').innerHTML = `${T} <span class="dim">${any.name || ''}</span> ${ZH[T] ? '<b>' + ZH[T] + '</b>' : ''} <a href="index.html">← 返回看板</a>`;
  $('#subtitle').textContent = `${ZH[T] ? ZH[T] + ' · ' : ''}${any.category || ''} · 上游 PRUNplanner/FIO 日线 · ${cxList.length} 个交易所 · 图上蜡烛为日线 OHLC，蓝线为 10 日均线，下方柱为成交额`;
  $('#tabs').innerHTML = cxList.map(c => `<button class="tab ${c === cx ? 'on' : ''}" data-cx="${c}">${c}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    cx = b.dataset.cx;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.cx === cx));
    FC = (FORECAST && FORECAST.bySeries && FORECAST.bySeries[T + '|' + cx]) || null;
    setRange(0); renderCards(); renderBreakdown();
  }));
  const row = BOARD.rows.find(r => r.ticker === T && r.cx === cx);
  $('#breakdown').innerHTML = breakdownHtml(row);
  renderFreight();
  renderSupply();
  renderExtraction();
  $('#bnote').textContent = '人工成本 = Σ(该建筑各层级工人数/100 × 该层级「每 100 人每日消耗品篮子」) × 生产时长 ÷ 产出数量。先驱/定居者篮子已与官方手册核对；技术员/工程师/科学家篮子取自游戏自带的 PAC 人口配方（÷10 折算成日）；不含建筑折旧与税费。';
  if (FORECAST && FORECAST.fit30) {
    $('#fcNote').innerHTML = '虚线 = 拟合模型给出的<b>价格路径预期</b>（r = a + b1×离 10 日均线距离 + b2×总毛利率 + b3×低波动），阴影 = ±1σ 残差区间。样本内拟合：30 天 R² ' + (FORECAST.fit30.r2 * 100).toFixed(1) + '%、σ ' + (FORECAST.fit30.sigma * 100).toFixed(1) + '%；90 天 R² ' + (FORECAST.fit90.r2 * 100).toFixed(1) + '%、σ ' + (FORECAST.fit90.sigma * 100).toFixed(1) + '%。不是投资建议，残差很大。';
  }
  renderCards();
  setRange(0);
  resize();
})();

function renderExtraction() {
  const box = document.getElementById('extractBox');
  const e = EXTRACTION && EXTRACTION.byMaterial && EXTRACTION.byMaterial[T];
  if (!e) { box.innerHTML = '<div class="note">该商品不是采掘类（没有行星资源丰度数据），成本锚走配方那一套。</div>'; return; }
  box.innerHTML = `<table><thead><tr><th>建筑</th><th>最佳行星</th><th>丰度</th><th>产出/天</th><th>人工/天</th><th>折旧/天</th><th>单件成本</th><th>现价</th><th>毛利</th><th>中位丰度成本</th><th>可选行星</th></tr></thead><tbody><tr>
    <td>${e.building}</td><td>${e.bestPlanet}</td><td>${fmt(e.bestFactor, 3)}</td><td>${fmt(e.unitsPerDay, 1)}</td>
    <td>${fmt(e.labour, 0)}</td><td>${fmt(e.wear, 0)}</td><td><b>${fmt(e.costPerUnit, 1)}</b></td><td>${fmt(e.price, 1)}</td>
    <td class="${signCls(e.marginPct)}"><b>${fmt(e.marginPct, 1)}%</b></td><td>${fmt(e.costAtMidFactor, 1)}</td><td>${int(e.planets)}</td></tr></tbody></table>
    <div class="note">口径：<b>产出/天 = 70 × 行星丰度</b>（用你自己基地的 RIG/EXT 订单标定：5 个行星、92 条订单，误差 0）；日成本 = 工人消耗品（先驱篮子）+ 建筑损耗，均按当前市价折算。「中位丰度成本」= 在全服中位丰度行星上挖的单价：价格长期低于它，边际矿工就会退出。</div>`;
}
function renderSupply() {
  const s = SUPPLY && SUPPLY.byTicker && SUPPLY.byTicker[T];
  const box = document.getElementById('supplyBox');
  if (!box) return;
  if (!s) { box.innerHTML = '<div class="note">该商品在社区月度产能统计里没有数据。</div>'; return; }
  box.innerHTML = `<table><thead><tr><th>月份</th><th>产量</th><th>消耗</th><th>过剩%</th><th>供给增速</th><th>单位利润</th><th>月产值</th><th>模型预期(次月)</th></tr></thead><tbody><tr>
    <td>${s.month}</td><td>${int(Math.round(s.amount))}</td><td>${int(Math.round(s.consumed))}</td>
    <td class="${signCls(-(s.surplus || 0))}">${s.surplus == null ? '—' : fmt(s.surplus, 0) + '%'}</td>
    <td class="${signCls(-(s.supplyGrowthPct || 0))}">${s.supplyGrowthPct == null ? '—' : fmt(s.supplyGrowthPct, 0) + '%'}</td>
    <td>${s.profitPerUnit == null ? '—' : fmt(s.profitPerUnit, 1)}</td><td class="dim">${int(Math.round((s.volume || 0) / 1e6))}M</td>
    <td class="${signCls(s.expectedNextMonthPct)}"><b>${s.expectedNextMonthPct == null ? '—' : (s.expectedNextMonthPct > 0 ? '+' : '') + fmt(s.expectedNextMonthPct, 1) + '%'}</b></td></tr></tbody></table>
    <div class="note">数据：prun.raylu.net 月度产能统计${s.raw ? ' · <b>该商品属于采掘类</b>（无上游配方成本）' : ''}。模型：次月收益 = a + b1×过剩 + b2×供给增速 + b3×单位利润（月度面板，样本内 R² ${SUPPLY.fit ? (SUPPLY.fit.r2 * 100).toFixed(1) : '—'}%）。</div>`;
}
function renderFreight() {
  const box = $('#freight'), note = $('#fnote');
  const f = FREIGHT && FREIGHT.byTicker && FREIGHT.byTicker[T];
  if (!f || Object.keys(f.prices).length < 2) { box.innerHTML = '<div class="note">该商品只有一个交易所有成交，无法做跨所比较。</div>'; note.textContent = ''; return; }
  const trip = FREIGHT.tripCost || 10000;
  const rows = Object.entries(f.prices).sort((a, b) => a[1] - b[1]).map(([c2, p2]) => {
    const gap = p2 - f.prices[f.cheapest];
    const be = gap > 0 ? Math.ceil(trip / gap) : null;
    return `<tr><td>${c2}${c2 === f.cheapest ? ' <span class="dim">(最低)</span>' : (c2 === f.dearest ? ' <span class="dim">(最高)</span>' : '')}</td><td>${fmt(p2)}</td><td class="${gap > 0 ? 'neg' : ''}">${gap === 0 ? '—' : '+' + fmt(gap)}</td><td>${be ? '≥ ' + int(be) + ' 件' : '—'}</td></tr>`;
  }).join('');
  box.innerHTML = `<table><thead><tr><th>交易所</th><th>最新价</th><th>比最低所贵</th><th>跑一趟的保本量</th></tr></thead><tbody>${rows}</tbody></table>`;
  note.innerHTML = '单程运费按 <b>' + int(trip) + '</b> 估算（' + (FREIGHT.tripCostSource || '') + '）。保本量 = 单程运费 ÷ 单位价差：低于这个量，把货从最低价交易所搬到高价所不划算。跨所价差 ≤ 运费时，说明价差是运费造成的、不是机会。';
}
function renderCards() {
  const row = BOARD.rows.find(r => r.ticker === T && r.cx === cx);
  if (!row) { $('#cards').innerHTML = ''; return; }
  $('#cards').innerHTML = [
    ['最新价', fmt(row.price)], ['原料成本', fmt(row.matCost)], ['人工成本', fmt(row.labourCost)],
    ['毛利（扣人工后）', (row.marginPct == null ? '—' : row.marginPct + '%')], ['自身历史分位', row.marginPctile == null ? '—' : row.marginPctile + '%'],
    ['30 天成交额', int(row.tradedMoney30d)], ['距 10 日均线', row.below10dMeanPct == null ? '—' : row.below10dMeanPct + '%'],
    ['模型预期 30 天', FC ? ((FC.expected30Pct > 0 ? '+' : '') + FC.expected30Pct + '% ±' + FC.band30Pct + '%') : '—'],
    ['供给过剩(月)', (SUPPLY && SUPPLY.byTicker && SUPPLY.byTicker[T] && SUPPLY.byTicker[T].surplus != null) ? SUPPLY.byTicker[T].surplus + '%' : '—'],
    ['供给面预期(次月)', (SUPPLY && SUPPLY.byTicker && SUPPLY.byTicker[T] && SUPPLY.byTicker[T].expectedNextMonthPct != null) ? ((SUPPLY.byTicker[T].expectedNextMonthPct > 0 ? '+' : '') + SUPPLY.byTicker[T].expectedNextMonthPct + '%') : '—'],
    ['模型预期 90 天', FC ? ((FC.expected90Pct > 0 ? '+' : '') + FC.expected90Pct + '% ±' + FC.band90Pct + '%') : '—'],
  ].map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}
function renderBreakdown() {
  const row = BOARD.rows.find(r => r.ticker === T && r.cx === cx);
  $('#breakdown').innerHTML = breakdownHtml(row);
  renderCards();
}
</script>
</body>
